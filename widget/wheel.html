<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>NameWheel</title>
<style>
:root{--text:#F4F1FF;--muted:#ABA3CC;--soft:#DCD4F8;--card:#120826;--card2:rgba(255,255,255,.035);--chip:rgba(167,139,250,.12);--line:rgba(167,139,250,.24);--line2:rgba(167,139,250,.13);--violet:#7C3AED;--lav:#A78BFA;--cyan:#22D3EE;--okc:#34D399;--badc:#FB7185;--eyebrow:#67E8F9;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.light{--text:#1B1236;--muted:#5F5784;--soft:#3A2F66;--card:#FFFFFF;--card2:#F8F5FF;--chip:rgba(124,58,237,.07);--line:rgba(124,58,237,.20);--line2:rgba(124,58,237,.11);--eyebrow:#0E7490;--okc:#047857;--badc:#BE123C}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font:15px/1.5 var(--font);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit}
.app{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);padding:14px 18px 14px;
background:radial-gradient(560px 280px at 0% 0%,rgba(124,58,237,.24),transparent 70%),radial-gradient(460px 260px at 100% 100%,rgba(6,182,212,.13),transparent 70%),var(--card)}
.light .app{background:radial-gradient(560px 280px at 0% 0%,rgba(124,58,237,.09),transparent 70%),radial-gradient(460px 260px at 100% 100%,rgba(6,182,212,.07),transparent 70%),var(--card)}
.top{display:flex;align-items:center;gap:10px;min-height:30px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:.95rem;white-space:nowrap}
.brand svg{width:24px;height:24px;flex:0 0 auto}
.ttl{flex:1;min-width:0;color:var(--muted);font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl:not(:empty):before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55;margin:0 9px 2px 0;vertical-align:middle}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--chip);color:var(--soft)}
.pill svg{width:13px;height:13px}
.pill.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12);color:var(--okc)}
.pill.bad{border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.10);color:var(--badc)}
.spin{display:grid;gap:16px;align-items:center}
.spin.wide{grid-template-columns:auto minmax(0,1fr);gap:24px}
.stage{position:relative;justify-self:center;border-radius:22px;padding:14px;background:radial-gradient(110% 100% at 50% 15%,#2C1166 0%,#150632 55%,#0A0318 100%);box-shadow:inset 0 0 0 1px rgba(167,139,250,.2),0 22px 50px -30px rgba(76,29,149,.95)}
.wheelbox{position:relative}
.wheelbox canvas{display:block}
.pointer{position:absolute;left:50%;top:-10px;width:30px;height:38px;margin-left:-15px;transform-origin:50% 32%;transition:transform .2s cubic-bezier(.3,1.7,.5,1);filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(167,139,250,.75));z-index:2}
.pointer svg{display:block;width:100%;height:100%}
.result{min-width:0}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--eyebrow)}
.eyebrow.ok{color:var(--okc)}.eyebrow.bad{color:var(--badc)}
.winner{font-size:2.3rem;line-height:1.08;font-weight:850;letter-spacing:-.025em;margin:6px 0 6px;overflow-wrap:anywhere;background:linear-gradient(100deg,#FFFFFF 0%,#EDE3FF 35%,#B79CFF 68%,#67E8F9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.light .winner{background:linear-gradient(100deg,#2E1065 0%,#6D28D9 55%,#0E7490 100%);-webkit-background-clip:text;background-clip:text}
.winner.wait{color:transparent;-webkit-background-clip:border-box;background-clip:border-box;background:linear-gradient(90deg,var(--chip),rgba(167,139,250,.30),var(--chip));background-size:200% 100%;border-radius:12px;width:min(220px,70%);animation:sh 1.2s linear infinite}
.narrow .winner.wait{margin-left:auto;margin-right:auto}
.winner.pop{animation:pop .75s cubic-bezier(.2,1.4,.4,1) both}
.narrow .winner{font-size:1.9rem;text-align:center}
.narrow .result{text-align:center}.narrow .actions,.narrow .list{justify-content:center}
.sub{color:var(--muted);font-size:.88rem}
.list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.list li{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:999px;background:var(--chip);border:1px solid var(--line2);font-weight:700;font-size:.86rem;animation:rise .4s both}
.list li b{display:grid;place-items:center;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:linear-gradient(135deg,#8B5CF6,#0891B2);color:#fff;font-size:.7rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.86rem;font-weight:800;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--lav)}
.btn:focus-visible,.copy:focus-visible,.foot a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.primary{border-color:transparent;background:linear-gradient(135deg,#8B5CF6,#6D28D9 60%,#5B21B6);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 24px -10px rgba(124,58,237,.85)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.cert{margin-top:14px;border-radius:16px;padding:12px 14px;border:1px solid rgba(16,185,129,.38);background:linear-gradient(180deg,rgba(16,185,129,.11),rgba(16,185,129,.03));text-align:left}
.cert-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--okc)}
.cert-h svg{width:18px;height:18px;flex:0 0 auto}
.cert p{margin:5px 0 9px;font-size:.82rem;color:var(--muted);line-height:1.45}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.code{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;font-size:.84rem;letter-spacing:.06em;padding:3px 3px 3px 10px;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid var(--line2);color:var(--text)}
.light .code{background:#fff}
.hash{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.copy{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;padding:0}
.copy:hover{color:var(--text);background:var(--chip)}
.copy svg{width:14px;height:14px}
.copy.done{color:var(--okc)}
.note{margin-top:10px;font-size:.78rem;color:var(--muted)}
.teams-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.teams-h b{font-size:1.3rem;font-weight:850;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.team{border-radius:16px;border:1px solid var(--line2);border-top:3px solid var(--tc);background:var(--card2);overflow:hidden;animation:rise .45s both}
.team-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 8px;font-weight:800;font-size:.92rem}
.team-h .tn{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-h i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--tc)}
.team-h .n{font-size:.72rem;font-weight:800;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px}
.team ul{list-style:none;margin:0;padding:0 12px 10px}
.team li{padding:5px 0;font-size:.9rem;border-top:1px solid var(--line2);overflow-wrap:anywhere}
.ver{display:grid;gap:14px}
.ver-top{display:flex;gap:14px;align-items:center}
.seal{flex:0 0 auto;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#34D399,#047857);box-shadow:0 12px 30px -12px rgba(16,185,129,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.seal.bad{background:linear-gradient(135deg,#FB7185,#BE123C);box-shadow:0 12px 30px -12px rgba(244,63,94,.75)}
.seal svg{width:32px;height:32px}
.vtitle{font-size:1.45rem;font-weight:850;letter-spacing:-.02em;line-height:1.15;margin:3px 0 2px;overflow-wrap:anywhere}
.checks{list-style:none;margin:0;padding:0;border-radius:16px;border:1px solid var(--line2);background:var(--card2);overflow:hidden}
.checks li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);animation:rise .4s both}
.checks li:first-child{border-top:0}
.ic{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:50%;display:grid;place-items:center;background:rgba(16,185,129,.16);color:var(--okc)}
.ic.bad{background:rgba(244,63,94,.15);color:var(--badc)}
.ic.warn{background:rgba(245,158,11,.16);color:#F59E0B}
.ic.wait{background:var(--chip);color:var(--lav);animation:breathe 1.6s ease-in-out infinite}
.ic svg{width:13px;height:13px}
.checks b{display:block;font-size:.9rem}
.checks .d{display:block;font-size:.8rem;color:var(--muted);line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line2);color:var(--soft)}
.msg{display:flex;gap:12px;align-items:flex-start;padding:4px 2px 2px}
.msg b{display:block;font-size:1rem}
.msg p{margin:4px 0 0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.sk{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--chip),rgba(167,139,250,.24),var(--chip));background-size:200% 100%;animation:sh 1.2s linear infinite}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line2);font-size:.74rem;color:var(--muted)}
.foot a{color:var(--soft);font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:none}}
@keyframes breathe{50%{opacity:.18}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

    eb.textContent = cert ? "Certified winner" : wins.length > 1 ? "Winners" : "Winner";
    wn.className = "winner"; void wn.offsetWidth; wn.className = "winner pop";
    wn.textContent = name || "No winner";
    sub.textContent = cert ? "Drawn from " + plural(n, "entry", "entries") + " with TrueSpin™"
      : wins.length > 1 ? wins.length + " picked at random from " + plural(n, "entry", "entries") + ", in order"
      : "Picked at random from " + plural(n, "entry", "entries");
    extra.replaceChildren();
    if (wins.length > 1) extra.appendChild(h("ol", { class: "list" }, wins.map(function (w, i) { return h("li", { style: "animation-delay:" + (i * 70) + "ms" }, h("b", null, String(i + 1)), strip(w.name)); })));
    act.replaceChildren();
    if (cert) {
      var proof = sc.proofUrl || (SITE + "/v/" + sc.code);
      extra.appendChild(h("div", { class: "cert" },
        h("div", { class: "cert-h", html: ICON.shield + "<span>Sealed before the spin</span>" }),
        h("p", null, "NameWheel committed to this result before the wheel moved. Anyone can recompute it on the public proof page."),
        h("div", { class: "row" }, h("span", { class: "code" }, sc.code, copyBtn(proof, "Copy the proof link")), sc.commit ? h("span", { class: "hash", title: "Commitment published before the spin" }, "commit " + String(sc.commit).slice(0, 12) + "…") : null)));
      act.appendChild(mkBtn("Open proof page", ICON.open, function () { openLink(proof); }, true));
      if (sc.certificateUrl) act.appendChild(mkBtn("Signed certificate · $9", ICON.shield, function () { openLink(sc.certificateUrl); }));
    } else {
      act.appendChild(mkBtn("Spin again", ICON.again, function () { respin(false); }, true));
      if (n > 2 && wins.length === 1) act.appendChild(mkBtn("Remove and spin", ICON.remove, function () { respin(true); }));
      act.appendChild(mkBtn("Open big wheel", ICON.open, function () { openLink(sc.openUrl || SITE + "/?ref=mcp-widget"); }));
    }
    confetti(wn);
    reportSize();
    flushQueue();
  }

  function respin(removeLast) {
    if (W.spinning) return;
    var removed = null;
    if (removeLast && S.last != null && W.entries.length > 2) {
      removed = strip(W.entries[S.last]);
      W.entries.splice(S.last, 1);
      W.hi = null; buildWheel(); draw();
      var cv = $("wheel"); if (cv) cv.setAttribute("aria-label", "Wheel with " + plural(W.entries.length, "entry", "entries"));
    }
    var n = W.entries.length;
    if (n < 2) return;
    var idx = randInt(n);
    S.local++;
    $("eyebrow").textContent = "Spinning";
    var wn = $("winner"); wn.className = "winner wait"; wn.textContent = " ";
    $("extra").replaceChildren();
    Array.prototype.forEach.call($("actions").querySelectorAll("button"), function (b) { b.disabled = true; });
    spinTo(idx).then(function () {
      S.last = idx;
      var name = strip(W.entries[idx]);
      $("eyebrow").textContent = "Winner";
      wn.className = "winner"; void wn.offsetWidth; wn.className = "winner pop"; wn.textContent = name;
      $("sub").textContent = "Picked at random from " + plural(n, "entry", "entries") + (removed ? ", after taking " + removed + " off" : "");
      $("extra").replaceChildren(h("div", { class: "note" }, "Spun again here in the chat (spin " + (S.local + 1) + ")."));
      var act = $("actions"); act.replaceChildren();
      act.appendChild(mkBtn("Spin again", ICON.again, function () { respin(false); }, true));
      if (n > 2) act.appendChild(mkBtn("Remove and spin", ICON.remove, function () { respin(true); }));
      act.appendChild(mkBtn("Open big wheel", ICON.open, function () { openLink((S.sc && S.sc.openUrl) || SITE + "/?ref=mcp-widget"); }));
      confetti(wn);
      reportSize();
      tellModel("The person spun the NameWheel wheel again in the widget" + (removed ? " after removing " + removed : "") + ": " + name + " won, picked at random from " + plural(n, "entry", "entries") + ". This replaces the earlier pick shown in the chat.");
      flushQueue();
    });
  }

  function teamsText(teams) { return teams.map(function (t) { return t.name + ": " + t.members.join(", "); }).join("\n"); }

  function showTeams(sc) {
    var teams = (sc.teams || []).map(function (t) { return { name: String(t.name), members: (t.members || []).map(String) }; });
    header(sc.title, "teams");
    foot("Fair random picks");
    S.view = "teams";
    W.idle = false;
    var total = sc.total || teams.reduce(function (a, t) { return a + t.members.length; }, 0);
    var copyB = mkBtn("Copy teams", ICON.copy, function () { copyText(teamsText(teams), copyB); });
    view.replaceChildren(
      h("div", { class: "teams-h" }, h("b", null, plural(teams.length, "team")), h("span", { class: "sub" }, plural(total, "name") + ", split at random")),
      h("div", { class: "grid" }, teams.map(function (t, i) {
        var col = TEAM[i % TEAM.length];
        return h("div", { class: "team", style: "--tc:" + col + ";animation-delay:" + (i * 60) + "ms" },
          h("div", { class: "team-h" }, h("span", { class: "tn" }, h("i"), t.name), h("span", { class: "n" }, String(t.members.length))),
          h("ul", null, t.members.map(function (m) { return h("li", null, m); })));
      })),
      h("div", { class: "actions" }, copyB, mkBtn("Shuffle again", ICON.shuffle, function () {
        var all = [];
        teams.forEach(function (t) { all = all.concat(t.members); });
        for (var i = all.length - 1; i > 0; i--) { var j = randInt(i + 1), tmp = all[i]; all[i] = all[j]; all[j] = tmp; }
        var next = teams.map(function (t) { return { name: t.name, members: [] }; });
        all.forEach(function (m, i) { next[i % next.length].members.push(m); });
        S.key = null;
        showTeams({ title: sc.title, total: total, teams: next });
        tellModel("The person shuffled the teams again in the NameWheel widget. The teams are now: " + teamsText(next).replace(/\n/g, "; ") + ". This replaces the earlier split shown in the chat.");
      })));
    reportSize();
  }

  function showVerify(sc) {
    var ok = !!sc.genuine;
    header(sc.title, ok ? "ok" : "bad");
    foot("Recomputed from the public record");
    S.view = "verify";
    W.idle = false;
    var proof = sc.proofUrl || (SITE + "/v/" + sc.code);
    var at = sc.attempts;
    var facts = [plural(sc.entriesCount || 0, "entry", "entries"), fmtDate(sc.createdAt)];
    if (at && at.total) facts.push(at.total === 1 ? "Only draw on this list" : at.total + " draws on this list" + (at.abandoned ? ", " + at.abandoned + " never finished" : ""));
    if (sc.hasVideo) facts.push("Video on the proof page");
    view.replaceChildren(h("div", { class: "ver" },
      h("div", { class: "ver-top" }, h("div", { class: "seal" + (ok ? "" : " bad"), html: ok ? ICON.shield : ICON.alert }),
        h("div", { style: "min-width:0" }, h("div", { class: "eyebrow " + (ok ? "ok" : "bad") }, ok ? "Genuine draw" : "Not confirmed"),
          h("div", { class: "vtitle" }, sc.winner ? strip(sc.winner) + " won" : sc.title || sc.code),
          h("div", { class: "sub" }, "“" + (sc.title || "") + "” · code " + sc.code))),
      h("div", { class: "facts" }, facts.map(function (f) { return h("span", { class: "fact" }, f); })),
      h("ul", { class: "checks" }, (sc.checks || []).map(function (c, i) {
        return h("li", { style: "animation-delay:" + (i * 90) + "ms" }, h("span", { class: "ic" + (c.ok ? "" : " bad"), html: c.ok ? ICON.check : ICON.x }), h("div", null, h("b", null, c.name), h("span", { class: "d" }, c.detail)));
      })),
      h("div", { class: "actions", style: "margin-top:0" }, mkBtn("Open proof page", ICON.open, function () { openLink(proof); }, true), h("span", { class: "code" }, sc.code, copyBtn(proof, "Copy the proof link")))));
    reportSize();
  }

  // Footer link and any other plain links open through the host.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-open]");
    if (!a) return;
    e.preventDefault(); openLink(a.getAttribute("data-open"));
  });

  var rt = 0, lastW = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var w = app.clientWidth;
      if (Math.abs(w - lastW) < 2) return;
      lastW = w;
      var sp = $("spin");
      if (sp) { var wide = isWide(); sp.className = "spin " + (wide ? "wide" : "narrow"); if (wheelSize() !== W.size) mountCanvas(); }
      reportSize();
    }, 120);
  });
  lastW = app.clientWidth;

  // ── Start ────────────────────────────────────────────────────────────
  showMessage("Waiting for the wheel", "The result appears here as soon as NameWheel answers.", "wait");
  header("", null);
  if (framed) {
    request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "namewheel-wheel", version: "1.0.0" }, clientInfo: { name: "namewheel-wheel", version: "1.0.0" }, appCapabilities: {} }, 4000)
      .then(function (r) { if (r && r.hostContext) applyContext(r.hostContext); }, function () {})
      .then(function () { notify("ui/notifications/initialized", {}); reportSize(); });
  }
  // ChatGPT exposes the call and its result on window.openai as well.
  function fromOpenAI(g) {
    var o = g || oa();
    if (!o) return;
    if (o.theme) setTheme(o.theme);
    if (o.toolOutput && o.toolOutput.kind) onResult({ structuredContent: o.toolOutput });
    else if (o.toolInput && !S.sc) onInput(o.toolInput);
  }
  window.addEventListener("openai:set_globals", function (e) { fromOpenAI((e.detail && e.detail.globals) || null); }, { passive: true });
  fromOpenAI(null);
  reportSize();
})();
</script>
